<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المنظمين | مدارِّك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f3f0e8;
      --ink: #17191c;
      --blue: #174de8;
      --muted: #777a80;
      --line: #dedbd2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: var(--blue);
      color: white;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 600;
    }

    .brand {
      font-size: 23px;
      font-weight: 700;
    }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .card {
      margin-top: 36px;
      padding: 30px 24px;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: right;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 8px;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 19px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      font: inherit;
      outline: none;
      direction: rtl;
    }

    input:focus {
      border-color: var(--blue);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 13px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .message {
      display: none;
      color: #a33;
      font-size: 13px;
      margin-top: 15px;
      text-align: center;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">م</div>
    <div class="brand">مدارِّك</div>
    <div class="tagline">معرفة تتجاوز المألوف</div>

    <section class="card">
      <h1>دخول المنظمين</h1>
      <p class="description">يرجى تسجيل الدخول للمتابعة إلى نظام الحضور.</p>

      <form id="loginForm">
        <label for="username">اسم المستخدم</label>
        <input id="username" type="text" autocomplete="username" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit">تسجيل الدخول</button>
        <p class="message" id="message">لم يتم إعداد تسجيل الدخول بعد.</p>
      </form>
    </section>

    <footer>مدارك © 2026</footer>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('message').style.display = 'block';
    });
  </script>
</body>
</html>
